name: Lantern Dash private review package
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/race/lanternCoach*'
      - 'src/ui/LanternCoachHud.ts'
      - 'scripts/lantern-*'
      - 'scripts/package-lantern-review.mjs'
      - 'scripts/review-windows.ps1'
      - '.github/workflows/lantern-review.yml'
permissions:
  contents: read
concurrency:
  group: lantern-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --maxWorkers=2
      - run: GITHUB_SHA="$(git rev-parse HEAD)" npm run build
      - run: npx playwright install --with-deps chromium
      - name: Build preserved released baseline without switching the checkout
        run: |
          mkdir /tmp/lantern-baseline
          git archive f97bac535611e09c6c732230b5f0ca73b9bbf804 | tar -x -C /tmp/lantern-baseline
          ln -s "$PWD/node_modules" /tmp/lantern-baseline/node_modules
          GITHUB_SHA=f97bac535611e09c6c732230b5f0ca73b9bbf804 npm run build --prefix /tmp/lantern-baseline
      - name: Exact-head production controller and lifecycle checks
        run: |
          npm run preview -- --host 127.0.0.1 --port 5174 --strictPort > /tmp/lantern-preview.log 2>&1 &
          preview_pid=$!
          npm run preview --prefix /tmp/lantern-baseline -- --host 127.0.0.1 --port 5176 --strictPort > /tmp/lantern-baseline-preview.log 2>&1 &
          baseline_pid=$!
          trap 'kill "$preview_pid" "$baseline_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5174/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/lantern-review-check.mjs http://127.0.0.1:5176 --baseline --expected-head=f97bac535611e09c6c732230b5f0ca73b9bbf804 --out=/tmp/lantern-evidence/before
          node scripts/lantern-review-check.mjs http://127.0.0.1:5174 --out=/tmp/lantern-evidence/after
          node scripts/compare-lantern-review.mjs /tmp/lantern-evidence
      - name: Prepare Windows loopback review build
        run: |
          node scripts/package-lantern-review.mjs /tmp/lantern-review
          cp -r /tmp/lantern-evidence /tmp/lantern-review/evidence
          cd /tmp/lantern-review
          zip -qr /tmp/lantern-dash-review.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: lantern-dash-review-${{ github.event.pull_request.head.sha }}
          path: /tmp/lantern-dash-review.zip
          retention-days: 30
      - name: Preserve failed-check evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lantern-dash-failed-check-${{ github.event.pull_request.head.sha }}
          path: |
            /tmp/lantern-evidence/
            /tmp/lantern-preview.log
          retention-days: 30
